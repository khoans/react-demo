name: Master Release (Production)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: react-demo

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build and Push Docker Image to ECR
        id: docker-push
        uses: ./.github/actions/docker-ecr-push
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          dockerfile: ./Dockerfile_aws
          context: .

      - name: Generate Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "${{ steps.docker-push.outputs.image-uri }}",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 3000,
                "HostPort": 80
              }
            ],
            "Logging": "/var/log/nginx"
          }
          EOF
          echo "Generated Dockerrun.aws.json:"
          cat Dockerrun.aws.json

      - name: Copy production config
        run: |
          echo "📦 Using production configuration"
          cp configs/prod/cfg.yml .ebextensions/cfg.yml
          echo "Config copied"
          echo "📋 .ebextensions files:"
          ls -la .ebextensions/

      - name: Install EB CLI
        run: |
          pip install --upgrade pip
          pip install awsebcli

      - name: Initialize Elastic Beanstalk
        run: |
          if [ ! -f .elasticbeanstalk/config.yml ]; then
            eb init react-demo \
              --platform "Docker running on 64bit Amazon Linux 2023" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Check if production environment exists
        id: check_env
        run: |
          if eb list | grep -q "${{ env.EB_ENVIRONMENT }}"; then
            echo "✅ Environment ${{ env.EB_ENVIRONMENT }} exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Environment ${{ env.EB_ENVIRONMENT }} does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create environment (if needed)
        if: steps.check_env.outputs.exists == 'false'
        run: |
          echo "Creating environment: ${{ env.EB_ENVIRONMENT }}"
          eb create ${{ env.EB_ENVIRONMENT }} \
            --single \
            --timeout 20

      - name: Deploy to Elastic Beanstalk
        id: deploy
        run: |
          echo "🚀 Deploying Docker image to ${{ env.EB_ENVIRONMENT }}"
          
          # Get current version before deployment
          CURRENT_VERSION=$(eb status ${{ env.EB_ENVIRONMENT }} | grep "Deployed Version" | awk '{print $3}')
          echo "Current version: $CURRENT_VERSION"
          
          # Deploy
          if eb deploy ${{ env.EB_ENVIRONMENT }} --timeout 20; then
            echo "✅ Deployment successful"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Deployment failed"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            
            # Try to rollback
            if [ ! -z "$CURRENT_VERSION" ]; then
              echo "🔄 Rolling back to version: $CURRENT_VERSION"
              eb deploy ${{ env.EB_ENVIRONMENT }} --version $CURRENT_VERSION --timeout 10 || echo "Rollback failed"
            fi
            
            exit 1
          fi

      - name: Verify deployment health
        if: steps.deploy.outputs.deployment_status == 'success'
        run: |
          echo "🔍 Verifying environment health..."
          sleep 10
          HEALTH=$(eb status ${{ env.EB_ENVIRONMENT }} | grep Health | awk '{print $2}')
          echo "Environment health: $HEALTH"
          
          if [ "$HEALTH" != "Green" ] && [ "$HEALTH" != "Yellow" ]; then
            echo "❌ Environment is not healthy: $HEALTH"
            exit 1
          fi
          
          echo "✅ Environment is healthy"

      - name: Get environment URL
        id: url
        run: |
          URL=$(eb status production-env | grep CNAME | awk '{print $2}')
          echo "url=http://$URL" >> $GITHUB_OUTPUT
          echo "🌐 Application URL: http://$URL"

      - name: Deployment summary
        run: |
          echo "## 🎉 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "**EB Environment:** ${{ env.EB_ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**ECR Repository:** ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** ${{ steps.docker-push.outputs.image-uri }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ steps.docker-push.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.docker-push.outputs.image-uri }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker image built and pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dockerrun.aws.json generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployed to Elastic Beanstalk" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container port 3000 mapped to host port 80" >> $GITHUB_STEP_SUMMARY
