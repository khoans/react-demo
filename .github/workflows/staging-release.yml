name: Staging Release (NonProd)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    environment:
      name: nonprod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build application
        run: npm run build

      - name: Copy staging config
        run: |
          echo "📦 Using staging/nonprod configuration"
          cp configs/nonprod/cfg.yml .ebextensions/cfg.yml
          echo "Config copied:"
          cat .ebextensions/cfg.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Install EB CLI
        run: |
          pip install --upgrade pip
          pip install awsebcli

      - name: Initialize Elastic Beanstalk
        run: |
          if [ ! -f .elasticbeanstalk/config.yml ]; then
            eb init react-demo \
              --platform "Node.js 24 running on 64bit Amazon Linux 2023" \
              --region ap-southeast-2
          fi

      - name: Check if staging environment exists
        id: check_env
        run: |
          if eb list | grep -q "staging-env"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Environment staging-env exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Environment staging-env does not exist"
          fi

      - name: Create environment (if needed)
        if: steps.check_env.outputs.exists == 'false'
        run: |
          echo "Creating environment: staging-env"
          eb create staging-env \
            --single \
            --instance-types t3.micro \
            --timeout 20

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging-env"
          eb deploy staging-env --timeout 20

      - name: Get environment URL
        id: url
        run: |
          URL=$(eb status staging-env | grep CNAME | awk '{print $2}')
          echo "url=http://$URL" >> $GITHUB_OUTPUT
          echo "🌐 Application URL: http://$URL"

      - name: Deployment summary
        run: |
          echo "## 🎉 Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** staging/nonprod" >> $GITHUB_STEP_SUMMARY
          echo "**EB Environment:** staging-env" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Config:** configs/nonprod/cfg.yml" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ dist/ (built React app)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ src/server.js (Express server)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ package.production.json (minimal deps)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ .ebextensions/cfg.yml (from configs/nonprod/cfg.yml)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ .platform/hooks/" >> $GITHUB_STEP_SUMMARY

